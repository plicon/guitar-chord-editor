name = "fretkit-worker"
main = "src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# LLM provider: set LLM_PROVIDER and corresponding API key secret
# Supported: google (GOOGLE_AI_API_KEY), openai (OPENAI_API_KEY), anthropic (ANTHROPIC_API_KEY)

# Development environment (default)
[env.development]
name = "fretkit-worker-development"
vars = { ENVIRONMENT = "development", LLM_PROVIDER = "google", ADMIN_USERNAME = "fradmin" }
[[env.development.d1_databases]]
binding = "DB"
database_name = "fretkit-db"
database_id = "d9c128f4-06c6-471b-9e84-ffbd4a0f280b"
migrations_dir = "migrations"

# Production environment
[env.production]
name = "fretkit-worker-production"
vars = { ENVIRONMENT = "production", LLM_PROVIDER = "google", ADMIN_USERNAME = "fradmin" }
[[env.production.d1_databases]]
binding = "DB"
database_name = "fretkit-db-production"
database_id = "1f1b225b-1977-4f49-a244-4e320dee0374"
migrations_dir = "migrations"

# Staging environment
[env.staging]
name = "fretkit-worker-staging"
vars = { ENVIRONMENT = "staging", LLM_PROVIDER = "google", ADMIN_USERNAME = "fradmin" }
[[env.staging.d1_databases]]
binding = "DB"
database_name = "fretkit-db-staging"
database_id = "99f36e70-f499-4023-8bf8-1ac8f6c15a1e"
migrations_dir = "migrations"
